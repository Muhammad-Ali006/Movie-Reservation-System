spring.application.name=movie-reservation

# Database (env vars with local defaults; override on the server)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/movie_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# JDBC
spring.jdbc.template.fetch-size=50

# SQL Initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# JWT
jwt.secret=${JWT_SECRET:super-secret-key-for-movie-reservation-that-is-long-enough-for-hs256}
jwt.expiration=86400000

# File upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Uploads directory (relative to the working directory; override on the server)
app.upload.dir=${APP_UPLOAD_DIR:file:uploads/}

# Server
server.port=${PORT:8080}
